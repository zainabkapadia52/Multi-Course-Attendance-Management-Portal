{% extends "base.html" %}
{% block content %}
<h4 class="fw-bold mb-4">Student Portal</h4>

<ul class="nav nav-tabs mb-4">
  <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-courses">My Courses</button></li>
  <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-attendance">Attendance</button></li>
  <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-archive" onclick="loadAttArchive()">Past Semesters</button></li>
  <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-corrections">Correction Requests</button></li>
  <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-profile">Profile</button></li>
</ul>

<div class="tab-content">

  <!-- COURSES + STATS -->
  <div class="tab-pane fade show active" id="tab-courses">
    <div id="courses-stats-container">
      <p class="text-muted">Loading…</p>
    </div>
  </div>

  <!-- ATTENDANCE — current semester only -->
  <div class="tab-pane fade" id="tab-attendance">
    <div id="attendance-container">
      <p class="text-muted">Loading…</p>
    </div>
  </div>

  <!-- PAST SEMESTERS — archive -->
  <div class="tab-pane fade" id="tab-archive">
    <div class="d-flex align-items-center gap-3 mb-3">
      <label class="fw-semibold mb-0">Semester:</label>
      <select id="archive-sem-select" class="form-select w-auto" onchange="showArchiveSemester()">
        <option value="">Select…</option>
      </select>
    </div>
    <div id="archive-courses-container"></div>
    <div id="archive-corrections-container"></div>
  </div>

  <!-- CORRECTIONS -->
  <div class="tab-pane fade" id="tab-corrections">
    <div class="row g-4">
      <div class="col-lg-5">
        <div class="card">
          <div class="card-header">New Correction Request</div>
          <div class="card-body">
            <div id="corr-err" class="alert alert-danger d-none"></div>
            <div id="corr-ok"  class="alert alert-success d-none"></div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Course</label>
              <select id="corr-course" class="form-select" onchange="loadEligibleSessions()">
                <option value="">Select course…</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Session <span class="text-muted fw-normal">(absent sessions only)</span></label>
              <select id="corr-session" class="form-select"><option value="">Select session…</option></select>
              <div id="sessions-info" class="form-text text-warning d-none">No absent sessions found for this course.</div>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Reason</label>
              <textarea id="corr-reason" class="form-control" rows="3"></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Proof URL <span class="text-muted fw-normal">(optional)</span></label>
              <input id="corr-proof" class="form-control" placeholder="https://…">
            </div>
            <button class="btn btn-dark w-100" onclick="submitCorrection()">Submit Request</button>
          </div>
        </div>
      </div>
      <div class="col-lg-7">
        <div class="card">
          <div class="card-header">My Requests — Current Semester</div>
          <div class="card-body p-0">
            <table class="table mb-0" id="req-table">
              <thead class="table-light">
                <tr><th>Date</th><th>Course</th><th>Session</th><th>Status</th></tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  
  <!-- PROFILE -->
  <div class="tab-pane fade" id="tab-profile">
    <div class="card" style="max-width:480px">
      <div class="card-header">My Profile</div>
      <div class="card-body" id="profile-body">Loading…</div>
    </div>
  </div>

</div>
{% endblock %}

{% block scripts %}
<script>
let _statsData   = [];
let _archiveData = [];
let _archiveCorrData = [];

// ── courses tab ───────────────────────────────────────────────────────────────
async function loadStats() {
  const data = await api("GET", "/api/student/attendance-stats/current");
  if (!data) return;
  _statsData = data;

  const con = document.getElementById("courses-stats-container");
  if (!data.length) {
    con.innerHTML = '<p class="text-muted">Not enrolled in any courses this semester.</p>';
    buildAttendanceView([]);
    return;
  }

  con.innerHTML = data.map(c => {
    const barColor = c.colour === "success" ? "#198754"
                   : c.colour === "warning" ? "#ffc107"
                   : c.colour === "danger"  ? "#dc3545"
                   : "#6c757d";

    const warningBadge =
      c.warning === "no_sessions" ? '<div class="mt-2 text-muted" style="font-size:.82rem">No sessions held yet</div>'
      : c.warning === "too_early" ? `<div class="mt-2 text-muted" style="font-size:.82rem">Only ${c.total_sessions} session(s) held — too early to assess</div>`
      : c.warning === "at_risk"   ? '<div class="mt-2 text-danger" style="font-size:.82rem">⚠ Attendance below 75% — at risk</div>'
      : c.warning === "borderline"? '<div class="mt-2 text-warning" style="font-size:.82rem">Attendance between 75–85% — keep it up</div>'
      : '';

    const pctBadge = c.warning === "no_sessions" || c.warning === "too_early"
      ? `<span class="badge bg-secondary">—</span>`
      : `<span class="badge bg-${c.colour === 'success' ? 'success' : c.colour === 'warning' ? 'warning text-dark' : 'danger'} fs-6">${c.percentage}%</span>`;

    return `
      <div class="card mb-3">
        <div class="card-body py-3">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <div>
              <span class="badge bg-secondary me-2">${c.code}</span>
              <strong>${c.name}</strong>
            </div>
            ${pctBadge}
          </div>
          <div class="progress mb-2" style="height:8px">
            <div class="progress-bar" style="width:${c.percentage}%;background:${barColor}"></div>
          </div>
          <div class="d-flex gap-3" style="font-size:.82rem;color:#666">
            <span>Total: <strong>${c.total_sessions}</strong></span>
            <span class="text-success">Present: <strong>${c.present}</strong></span>
            <span class="text-danger">Absent: <strong>${c.absent}</strong></span>
          </div>
          ${warningBadge}
        </div>
      </div>`;
  }).join("");

  document.getElementById("corr-course").innerHTML =
    '<option value="">Select course…</option>' +
    data.map(c => `<option value="${c.course_id}">${c.code} — ${c.name}</option>`).join("");

  buildAttendanceView(data);
}

// ── attendance tab ────────────────────────────────────────────────────────────
function buildAttendanceView(data) {
  const con = document.getElementById("attendance-container");
  if (!data.length) {
    con.innerHTML = '<p class="text-muted">No attendance records for the current semester.</p>'; return;
  }
  con.innerHTML = data.map(c => `
    <div class="card mb-3">
      <div class="card-header d-flex justify-content-between align-items-center py-2"
           style="cursor:pointer" onclick="toggleAttCourse('att-${c.course_id}', this)">
        <div>
          <span class="badge bg-secondary me-2">${c.code}</span>
          <strong>${c.name}</strong>
          <span class="ms-2 badge bg-${
            c.colour === 'success' ? 'success' :
            c.colour === 'warning' ? 'warning text-dark' :
            c.colour === 'danger'  ? 'danger' : 'secondary'}">
            ${c.warning === 'no_sessions' || c.warning === 'too_early' ? '—' : c.percentage + '%'}
          </span>
        </div>
        <span id="att-toggle-${c.course_id}" style="font-size:.85rem">
          ▶ ${c.total_sessions === 0 ? 'No sessions yet' : c.total_sessions + ' sessions'}
        </span>
      </div>
      <div id="att-${c.course_id}" class="d-none">
        <div class="card-body p-0">
          ${c.records.length ? `
            <table class="table table-sm mb-0">
              <thead class="table-light"><tr><th>Date</th><th>Topic</th><th>Status</th></tr></thead>
              <tbody>
                ${c.records.map(r => `
                  <tr>
                    <td>${r.session_date}</td>
                    <td>${r.topic || '—'}</td>
                    <td>${badge(r.status)}</td>
                  </tr>`).join("")}
              </tbody>
            </table>` :
            '<p class="text-muted p-3 mb-0">No sessions recorded yet.</p>'
          }
        </div>
      </div>
    </div>`).join("");
}

function toggleAttCourse(id, hdr) {
  const panel  = document.getElementById(id);
  const hidden = panel.classList.toggle("d-none");
  const cid    = id.replace("att-", "");
  const label  = document.getElementById(`att-toggle-${cid}`);
  const c      = _statsData.find(x => x.course_id == cid);
  if (c) {
    const sessLabel = c.total_sessions === 0 ? 'No sessions yet' : c.total_sessions + ' sessions';
    label.textContent = hidden ? `▶ ${sessLabel}` : `▼ ${sessLabel}`;
  }
}

// ── past semesters tab ────────────────────────────────────────────────────────
async function loadAttArchive() {
  if (_archiveData.length && _archiveCorrData.length) return;

  const [attData, corrData] = await Promise.all([
    api("GET", "/api/student/attendance-stats/archive"),
    api("GET", "/api/student/corrections/archive")
  ]);

  if (attData)  _archiveData     = attData;
  if (corrData) _archiveCorrData = corrData;

  // Build semester dropdown from attendance data
  const sel = document.getElementById("archive-sem-select");
  if (!_archiveData.length) {
    sel.innerHTML = '<option value="">No past semesters</option>';
    document.getElementById("archive-courses-container").innerHTML =
      '<p class="text-muted">No past semester data found.</p>';
    return;
  }
  sel.innerHTML = '<option value="">Select…</option>' +
    _archiveData.map(s => `<option value="${s.semester_id}">${s.semester_name}</option>`).join("");
}

function showArchiveSemester() {
  const sid      = parseInt(document.getElementById("archive-sem-select").value);
  const courseCon = document.getElementById("archive-courses-container");
  const corrCon   = document.getElementById("archive-corrections-container");

  if (!sid) { courseCon.innerHTML = ""; corrCon.innerHTML = ""; return; }

  // ── Courses ──
  const sem = _archiveData.find(s => s.semester_id === sid);
  if (!sem || !sem.courses.length) {
    courseCon.innerHTML = '<p class="text-muted">No courses found for this semester.</p>';
  } else {
    courseCon.innerHTML = `<h6 class="fw-semibold mb-3 mt-1">Courses</h6>` +
      sem.courses.map(c => `
        <div class="card mb-3">
          <div class="card-header d-flex justify-content-between align-items-center py-2"
               style="cursor:pointer" onclick="toggleArchiveCourse('arch-${c.course_id}', this)">
            <div>
              <span class="badge bg-secondary me-2">${c.code}</span>
              <strong>${c.name}</strong>
              <span class="ms-2 badge bg-${c.colour === 'success' ? 'success' : 'danger'}">
                ${c.total_sessions === 0 ? '—' : c.percentage + '%'}
              </span>
            </div>
            <span id="arch-toggle-${c.course_id}" style="font-size:.85rem">
              ▶ ${c.total_sessions} sessions
            </span>
          </div>
          <div id="arch-${c.course_id}" class="d-none">
            <div class="card-body p-0">
              ${c.records.length ? `
                <table class="table table-sm mb-0">
                  <thead class="table-light"><tr><th>Date</th><th>Topic</th><th>Status</th></tr></thead>
                  <tbody>
                    ${c.records.map(r => `
                      <tr>
                        <td>${r.session_date}</td>
                        <td>${r.topic || '—'}</td>
                        <td>${badge(r.status)}</td>
                      </tr>`).join("")}
                  </tbody>
                </table>` :
                '<p class="text-muted p-3 mb-0">No sessions recorded.</p>'
              }
            </div>
          </div>
        </div>`).join("");
  }

  // ── Correction Requests ──
  const corrSem = _archiveCorrData.find(s => s.semester_id === sid);
  if (!corrSem || !corrSem.requests.length) {
    corrCon.innerHTML = `
      <h6 class="fw-semibold mb-3 mt-3">Correction Requests</h6>
      <p class="text-muted">No correction requests for this semester.</p>`;
  } else {
    corrCon.innerHTML = `<h6 class="fw-semibold mb-3 mt-3">Correction Requests</h6>
      <div class="card">
        <div class="card-body p-0">
          <table class="table mb-0">
            <thead class="table-light">
              <tr><th>Course</th><th>Session</th><th>Reason</th><th>Proof</th><th>Status</th></tr>
            </thead>
            <tbody>
              ${corrSem.requests.map(r => `
                <tr>
                  <td>${r.course_name}</td>
                  <td>${r.session_date}<br>
                    <span class="text-muted" style="font-size:.78rem">${r.topic || ''}</span>
                  </td>
                  <td style="max-width:200px;word-break:break-word">${r.reason}</td>
                  <td>${r.proof_url ? `<a href="${r.proof_url}" target="_blank">View</a>` : '—'}</td>
                  <td>${badge(r.status)}</td>
                </tr>`).join("")}
            </tbody>
          </table>
        </div>
      </div>`;
  }
}

function toggleArchiveCourse(id, hdr) {
  const panel  = document.getElementById(id);
  const hidden = panel.classList.toggle("d-none");
  const cid    = id.replace("arch-", "");
  const label  = document.getElementById(`arch-toggle-${cid}`);
  if (label) {
    const txt = label.textContent.replace('▼','').replace('▶','').trim();
    label.textContent = hidden ? `▶ ${txt}` : `▼ ${txt}`;
  }
}

// ── corrections (current semester) ───────────────────────────────────────────
async function loadEligibleSessions() {
  const cid  = document.getElementById("corr-course").value;
  const sel  = document.getElementById("corr-session");
  const info = document.getElementById("sessions-info");
  info.classList.add("d-none");
  if (!cid) { sel.innerHTML = '<option value="">Select session…</option>'; return; }
  const data = await api("GET", `/api/student/courses/${cid}/sessions`);
  if (!data || !data.length) {
    sel.innerHTML = '<option value="">No absent sessions</option>';
    info.classList.remove("d-none");
  } else {
    sel.innerHTML = '<option value="">Select session…</option>' + data.map(s =>
      `<option value="${s.att_session_id}">${s.session_date} — ${s.topic || 'Session'}</option>`
    ).join("");
  }
}

async function loadRequests() {
  const data = await api("GET", "/api/student/corrections/current");
  if (!data) return;
  document.querySelector("#req-table tbody").innerHTML = data.map(r =>
    `<tr>
      <td>${r.created_at.slice(0,10)}</td>
      <td>${r.course_name}</td>
      <td>${r.session_date}</td>
      <td>${badge(r.status)}</td>
    </tr>`
  ).join("") || '<tr><td colspan="4" class="text-center text-muted py-3">No requests this semester</td></tr>';
}

async function submitCorrection() {
  const errEl = document.getElementById("corr-err");
  const okEl  = document.getElementById("corr-ok");
  errEl.classList.add("d-none"); okEl.classList.add("d-none");
  const body = {
    course_id:      parseInt(document.getElementById("corr-course").value),
    att_session_id: parseInt(document.getElementById("corr-session").value),
    reason:         document.getElementById("corr-reason").value.trim(),
    proof_url:      document.getElementById("corr-proof").value.trim()
  };
  if (!body.course_id || !body.att_session_id || !body.reason) {
    errEl.textContent = "Course, session, and reason are required.";
    errEl.classList.remove("d-none"); return;
  }
  const res = await fetch("/api/student/corrections", {
    method: "POST", headers: _sessionHeaders(), body: JSON.stringify(body)
  });
  const d = await res.json();
  if (res.ok) {
    okEl.textContent = d.message; okEl.classList.remove("d-none");
    document.getElementById("corr-reason").value = "";
    document.getElementById("corr-proof").value  = "";
    loadRequests();
  } else {
    errEl.textContent = d.error; errEl.classList.remove("d-none");
  }
}

// ── profile ───────────────────────────────────────────────────────────────────
async function loadProfile() {
  const d = await api("GET", "/api/student/profile");
  if (!d) return;
  document.getElementById("profile-body").innerHTML = `
    <table class="table mb-0">
      <tr><th style="width:130px">Username</th><td>${d.username}</td></tr>
      <tr><th>Role</th><td><span class="badge bg-secondary">${d.role}</span></td></tr>
      <tr><th>Roll No</th><td>${d.roll_no || '—'}</td></tr>
      <tr><th>Program</th><td>${d.program || '—'}</td></tr>
      <tr><th>Batch</th><td>${d.batch || '—'}</td></tr>
      <tr><th>Last Login</th><td>${d.last_login ? d.last_login.slice(0,19)+' UTC' : '—'}</td></tr>
    </table>`;
}

loadStats(); loadRequests(); loadProfile();

window._realtimeHandlers = {
  correction_resolved() {
    loadRequests();
    // Reset archive cache so it reloads fresh next time
    _archiveCorrData = [];
    showToast("A correction request was resolved.", "info");
  },
  attendance_updated()         { loadStats(); },
  attendance_session_created() { loadStats(); loadEligibleSessions(); },
};
</script>
{% endblock %}
