<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CS432 Attendance System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f4f6fb; }
    .navbar { background: #1a1a2e !important; }
    .navbar-brand, .nav-link, .navbar-text { color: #e0e0e0 !important; }
    .nav-link:hover { color: #fff !important; }
    .card { border: none; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.07); }
    .card-header { background: transparent; border-bottom: 1px solid #eee; font-weight: 600; }
    .nav-tabs .nav-link.active { font-weight: 600; }
    .badge-pending  { background:#fff3cd;color:#856404; }
    .badge-accepted { background:#d1e7dd;color:#0a3622; }
    .badge-rejected { background:#f8d7da;color:#842029; }
    .badge-present  { background:#d1e7dd;color:#0a3622; }
    .badge-absent   { background:#f8d7da;color:#842029; }
    .badge-late     { background:#fff3cd;color:#856404; }
  </style>
</head>
<body>

<script>
  // Runs before anything renders — redirect to login if no session in this tab
  (function() {
    const sid = sessionStorage.getItem("session_id");
    const mac = sessionStorage.getItem("session_mac");
    if (!sid) { window.location.replace("/login"); return; }
    fetch("/isAuth", {
      headers: { "X-Session-Id": sid, "X-Session-Mac": mac || "" }
    }).then(r => {
      if (!r.ok) {
        sessionStorage.removeItem("session_id");
        sessionStorage.removeItem("session_mac");
        window.location.replace("/login");
      }
    }).catch(() => window.location.replace("/login"));
  })();
</script>

<nav class="navbar navbar-expand-lg mb-4">
  <div class="container">
    <span class="navbar-brand fw-bold">CS432 Attendance</span>
    <div class="ms-auto d-flex align-items-center gap-3">
      <span class="navbar-text">
        <span class="badge bg-secondary" id="nav-role"></span>
        <span id="nav-username"></span>
      </span>
      <button class="btn btn-sm btn-outline-light" onclick="doLogout()">Logout</button>
    </div>
  </div>
</nav>

<div class="container pb-5">
  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
// ── Session helpers — used everywhere ─────────────────────────────────────────
function _sessionHeaders() {
  return {
    "Content-Type":  "application/json",
    "X-Session-Id":  sessionStorage.getItem("session_id")  || "",
    "X-Session-Mac": sessionStorage.getItem("session_mac") || ""
  };
}

async function api(method, url, body) {
  const opts = { method, headers: _sessionHeaders() };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(url, opts);
  if (res.status === 401) {
    sessionStorage.removeItem("session_id");
    sessionStorage.removeItem("session_mac");
    window.location.replace("/login");
    return null;
  }
  return res.json();
}

async function doLogout() {
  await fetch("/logout", { method: "POST", headers: _sessionHeaders() }).catch(() => {});
  sessionStorage.removeItem("session_id");
  sessionStorage.removeItem("session_mac");
  window.location.replace("/login");
}

function badge(status) {
  return `<span class="badge badge-${status}">${status}</span>`;
}

function showToast(message, type = "info") {
  const colors = { success:"#d1e7dd", warning:"#fff3cd", info:"#cff4fc", danger:"#f8d7da" };
  const t = document.createElement("div");
  t.style.cssText = `position:fixed;bottom:24px;right:24px;z-index:9999;
    background:${colors[type]||colors.info};padding:12px 18px;border-radius:10px;
    box-shadow:0 4px 16px rgba(0,0,0,.12);font-size:.9rem;max-width:360px;transition:opacity .4s`;
  t.textContent = message;
  document.body.appendChild(t);
  setTimeout(() => { t.style.opacity = "0"; }, 3500);
  setTimeout(() => { t.remove(); }, 4000);
}

// ── Populate navbar username/role ─────────────────────────────────────────────
(async function() {
  const sid = sessionStorage.getItem("session_id");
  const mac = sessionStorage.getItem("session_mac");
  if (!sid) return;
  try {
    const res = await fetch("/isAuth", {
      headers: { "X-Session-Id": sid, "X-Session-Mac": mac || "" }
    });
    if (res.ok) {
      const d = await res.json();
      document.getElementById("nav-role").textContent     = d.role;
      document.getElementById("nav-username").textContent = d.username;
    }
  } catch(_) {}
})();

// ── SSE — per tab, uses sessionStorage session ────────────────────────────────
window._realtimeHandlers = {};

(function() {
  const sid = sessionStorage.getItem("session_id");
  const mac = sessionStorage.getItem("session_mac");
  if (!sid) return;
  const es = new EventSource(
    `/stream?session_id=${encodeURIComponent(sid)}&mac=${encodeURIComponent(mac||"")}`
  );
  es.addEventListener("connected", () => console.log("[SSE] connected"));
  es.onmessage = (e) => {
    try {
      const event   = JSON.parse(e.data);
      const handler = window._realtimeHandlers[event.type];
      if (handler) handler(event.data);
    } catch(_) {}
  };
})();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
