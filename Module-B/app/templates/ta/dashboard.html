{% extends "base.html" %}
{% block content %}
<h4 class="fw-bold mb-4">TA Panel</h4>

<ul class="nav nav-tabs mb-4">
  <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-courses">My Courses</button></li>
  <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-corrections" onclick="loadCorrections()">Correction Requests</button></li>
  <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-archive" onclick="loadTAArchive()">Archive</button></li>
  <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-profile" onclick="loadProfile()">Profile</button></li>
</ul>

<div class="tab-content">

  <!-- COURSES — one card per course -->
  <div class="tab-pane fade show active" id="tab-courses">
    <div id="ta-course-cards"></div>
  </div>

  <!-- CORRECTIONS — course wise -->
  <div class="tab-pane fade" id="tab-corrections">
    <div class="card">
      <div class="card-header">Correction Requests</div>
      <div id="ta-corr-table" class="card-body p-0"></div>
    </div>
  </div>
</div>

<!-- PROFILE -->
  <div class="tab-pane fade" id="tab-profile">
    <div class="card" style="max-width:480px">
      <div class="card-header">My Profile</div>
      <div class="card-body" id="profile-body">Loading…</div>
    </div>
  </div>

<!-- Create Session Modal -->
<div class="modal fade" id="taSessionModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="ta-modal-title">New Attendance Session</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="ta-sess-err" class="alert alert-danger d-none"></div>
        <input type="hidden" id="ta-modal-course-id">
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold">Date</label>
            <input id="ta-sess-date" class="form-control" type="date">
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Topic</label>
            <input id="ta-sess-topic" class="form-control" placeholder="Optional">
          </div>
        </div>
        <div id="ta-student-list"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-dark" onclick="createTaSession()">Save Session</button>
      </div>
    </div>
  </div>


  <!-- ARCHIVE — past courses semester wise -->
  <div class="tab-pane fade" id="tab-archive">
    <div class="d-flex align-items-center gap-3 mb-3">
      <label class="fw-semibold mb-0">Semester:</label>
      <select id="ta-archive-select" class="form-select w-auto" onchange="showTAArchiveSemester()">
        <option value="">Select…</option>
      </select>
    </div>
    <div id="ta-archive-container"></div>
  </div>

</div>
{% endblock %}

{% block scripts %}
<script>
let _taCourses = [];
async function loadProfile() {
  const d = await api("GET", "/api/ta/profile");
  if (!d) return;
  document.getElementById("profile-body").innerHTML = `
    <table class="table mb-0">
      <tr><th style="width:140px">Username</th><td>${d.username}</td></tr>
      <tr><th>Role</th><td><span class="badge bg-secondary">${d.role}</span></td></tr>
      <tr><th>Roll No</th><td>${d.roll_no || '—'}</td></tr>
      <tr><th>Program</th><td>${d.program || '—'}</td></tr>
      <tr><th>Batch</th><td>${d.batch || '—'}</td></tr>
      <tr><th>Department</th><td>${d.department || '—'}</td></tr>
      <tr><th>Last Login</th><td>${d.last_login ? d.last_login.slice(0,19)+' UTC' : '—'}</td></tr>
    </table>`;
}

let _taArchiveData = [];

async function loadTAArchive() {
  if (_taArchiveData.length) return;
  const data = await api("GET", "/api/ta/archive");
  if (!data) return;
  _taArchiveData = data;

  const sel = document.getElementById("ta-archive-select");
  if (!data.length) {
    sel.innerHTML = '<option value="">No past semesters</option>';
    document.getElementById("ta-archive-container").innerHTML =
      '<p class="text-muted">No past semester data.</p>';
    return;
  }
  sel.innerHTML = '<option value="">Select…</option>' +
    data.map(s => `<option value="${s.semester_id}">${s.semester_name}</option>`).join("");
}

function showTAArchiveSemester() {
  const sid = parseInt(document.getElementById("ta-archive-select").value);
  const con = document.getElementById("ta-archive-container");
  if (!sid) { con.innerHTML = ""; return; }

  const sem = _taArchiveData.find(s => s.semester_id === sid);
  if (!sem || !sem.courses.length) {
    con.innerHTML = '<p class="text-muted">No courses found for this semester.</p>'; return;
  }

  con.innerHTML = sem.courses.map(c => `
    <div class="card mb-3">
      <div class="card-header py-2">
        <span class="badge bg-secondary me-2">${c.code}</span>
        <strong>${c.name}</strong>
      </div>
    </div>`).join("");
}

async function loadTaCourses() {
  _taCourses = await api("GET", "/api/ta/courses");
  if (!_taCourses) return;
  const con = document.getElementById("ta-course-cards");
  if (!_taCourses.length) {
    con.innerHTML = '<p class="text-muted">No courses assigned.</p>'; return;
  }
  con.innerHTML = _taCourses.map(c => `
    <div class="card mb-4">
      <div class="card-header d-flex justify-content-between align-items-center py-2">
        <div>
          <span class="badge bg-secondary me-2">${c.code}</span>
          <strong>${c.name}</strong>
          <span class="text-muted ms-2" style="font-size:.85rem">${c.semester}</span>
        </div>
        <button class="btn btn-sm btn-dark"
          onclick="openCreateSession(${c.course_id}, '${c.code} — ${c.name}')">
          + New Session
        </button>
      </div>
      <div class="card-body p-0">
        <div id="sessions-${c.course_id}">
          <p class="text-muted p-3 mb-0" style="font-size:.85rem">Loading sessions…</p>
        </div>
      </div>
    </div>`).join("");

  for (const c of _taCourses) {
    loadCourseSessions(c.course_id);
  }
}

async function loadCourseSessions(courseId) {
  const sessions = await api("GET", `/api/ta/courses/${courseId}/sessions`);
  const con      = document.getElementById(`sessions-${courseId}`);
  if (!sessions || !sessions.length) {
    con.innerHTML = '<p class="text-muted p-3 mb-0" style="font-size:.85rem">No sessions yet.</p>'; return;
  }
  con.innerHTML = `
    <table class="table table-sm mb-0">
      <thead class="table-light">
        <tr><th>Date</th><th>Topic</th><th>Students</th></tr>
      </thead>
      <tbody>
        ${sessions.map(s => `
          <tr>
            <td>${s.session_date}</td>
            <td>${s.topic || '—'}</td>
            <td>
              <button class="btn btn-link btn-sm p-0"
                onclick="toggleTaSession(${s.att_session_id}, this)">
                ▶ View / Edit
              </button>
            </td>
          </tr>
          <tr id="ta-sturow-${s.att_session_id}" class="d-none bg-light">
            <td colspan="3" id="ta-stucell-${s.att_session_id}" class="p-3">Loading…</td>
          </tr>`).join("")}
      </tbody>
    </table>`;
}

async function toggleTaSession(sid, btn) {
  const row  = document.getElementById(`ta-sturow-${sid}`);
  const cell = document.getElementById(`ta-stucell-${sid}`);
  const show = row.classList.toggle("d-none") === false;
  btn.textContent = show ? "▼ Close" : "▶ View / Edit";

  if (show) {
    const records = await api("GET", `/api/ta/attendance-sessions/${sid}/records`);
    if (!records) return;
    if (!records.length) {
      cell.innerHTML = '<p class="text-muted mb-0">No records.</p>'; return;
    }
    renderSessionRecords(sid, records, false);
  }
}

function renderSessionRecords(sid, records, editMode) {
  const cell = document.getElementById(`ta-stucell-${sid}`);
  if (editMode) {
    cell.innerHTML = `
      <table class="table table-sm mb-2" style="max-width:480px">
        <thead class="table-light">
          <tr><th>Student</th><th>Status</th></tr>
        </thead>
        <tbody>
          ${records.map(r => `
            <tr>
              <td>${r.username}</td>
              <td>
                <select class="form-select form-select-sm w-auto ta-upd-status"
                  data-rid="${r.record_id}">
                  <option value="present" ${r.status==='present'?'selected':''}>Present</option>
                  <option value="absent"  ${r.status==='absent' ?'selected':''}>Absent</option>
                </select>
              </td>
            </tr>`).join("")}
        </tbody>
      </table>
      <button class="btn btn-sm btn-dark" onclick="saveSessionRecords(${sid})">Save</button>
      <button class="btn btn-sm btn-outline-secondary ms-2"
        onclick="renderSessionRecords(${sid}, ${JSON.stringify(records).replace(/"/g,'&quot;')}, false)">
        Cancel
      </button>`;
  } else {
    cell.innerHTML = `
      <table class="table table-sm mb-2" style="max-width:480px">
        <thead class="table-light">
          <tr><th>Student</th><th>Status</th></tr>
        </thead>
        <tbody>
          ${records.map(r => `
            <tr>
              <td>${r.username}</td>
              <td>${badge(r.status)}</td>
            </tr>`).join("")}
        </tbody>
      </table>
      <button class="btn btn-sm btn-outline-warning"
        onclick="switchToEdit(${sid})">Edit Attendance</button>`;
  }
}

async function switchToEdit(sid) {
  const records = await api("GET", `/api/ta/attendance-sessions/${sid}/records`);
  if (!records) return;
  renderSessionRecords(sid, records, true);
}

async function saveSessionRecords(sid) {
  const selects = document.querySelectorAll(`#ta-stucell-${sid} .ta-upd-status`);
  for (const sel of selects) {
    await api("PUT", `/api/ta/records/${sel.dataset.rid}`, { status: sel.value });
  }
  showToast(`${selects.length} record(s) saved.`, "success");
  const records = await api("GET", `/api/ta/attendance-sessions/${sid}/records`);
  if (records) renderSessionRecords(sid, records, false);
}

async function openCreateSession(courseId, courseLabel) {
  document.getElementById("ta-modal-course-id").value = courseId;
  document.getElementById("ta-modal-title").textContent = `New Session — ${courseLabel}`;
  document.getElementById("ta-sess-err").classList.add("d-none");
  document.getElementById("ta-sess-date").value  = "";
  document.getElementById("ta-sess-topic").value = "";
  const students = await api("GET", `/api/ta/courses/${courseId}/students`);
  if (!students) return;
  document.getElementById("ta-student-list").innerHTML = `
    <label class="form-label fw-semibold">Mark Attendance</label>
    <div style="max-height:280px;overflow-y:auto">
      <table class="table table-sm">
        <thead class="table-light"><tr><th>Student</th><th>Status</th></tr></thead>
        <tbody>
          ${students.map(s => `
            <tr>
              <td>${s.username}</td>
              <td>
                <select class="form-select form-select-sm ta-new-status" data-id="${s.user_id}">
                  <option value="present">Present</option>
                  <option value="absent" selected>Absent</option>
                </select>
              </td>
            </tr>`).join("")}
        </tbody>
      </table>
    </div>`;
  new bootstrap.Modal(document.getElementById("taSessionModal")).show();
}

async function createTaSession() {
  const errEl      = document.getElementById("ta-sess-err");
  const course_id  = parseInt(document.getElementById("ta-modal-course-id").value);
  const session_date = document.getElementById("ta-sess-date").value;
  if (!course_id || !session_date) {
    errEl.textContent = "Date is required."; errEl.classList.remove("d-none"); return;
  }
  const records = [...document.querySelectorAll(".ta-new-status")].map(el => ({
    student_id: parseInt(el.dataset.id), status: el.value
  }));
  const res = await fetch("/api/ta/attendance-sessions", {
    method: "POST", headers: _sessionHeaders(),
    body: JSON.stringify({
      course_id, session_date,
      topic: document.getElementById("ta-sess-topic").value,
      records
    })
  });
  if (res.ok) {
    bootstrap.Modal.getInstance(document.getElementById("taSessionModal")).hide();
    showToast("Session created!", "success");
    loadCourseSessions(course_id);
  } else {
    const d = await res.json();
    errEl.textContent = d.error; errEl.classList.remove("d-none");
  }
}

// ── corrections — course wise ─────────────────────────────────────────────────
async function loadCorrections() {
  const data = await api("GET", "/api/ta/corrections");
  if (!data) return;

  const con = document.getElementById("ta-corr-table").parentElement;

  if (!data.length) {
    con.innerHTML = `
      <div class="card-body text-muted text-center py-4">
        No correction requests yet.
      </div>`; return;
  }

  // Group by course
  const grouped = {};
  for (const r of data) {
    if (!grouped[r.course_id]) {
      grouped[r.course_id] = { course_name: r.course_name, requests: [] };
    }
    grouped[r.course_id].requests.push(r);
  }

  con.innerHTML = Object.entries(grouped).map(([courseId, group]) => {
    const pendingCount = group.requests.filter(r => r.status === 'pending').length;
    return `
      <div class="border-bottom">
        <div class="d-flex justify-content-between align-items-center px-3 py-2"
             style="cursor:pointer;background:#f8f9fa"
             onclick="toggleTaCorrCourse('ta-corr-${courseId}', this)">
          <span>
            <strong>${group.course_name}</strong>
            ${pendingCount > 0
              ? `<span class="badge bg-warning text-dark ms-2">${pendingCount} pending</span>`
              : '<span class="badge bg-secondary ms-2">all resolved</span>'}
          </span>
          <span id="ta-corr-toggle-${courseId}" style="font-size:.85rem">▶ Show</span>
        </div>
        <div id="ta-corr-${courseId}" class="d-none">
          <table class="table mb-0">
            <thead class="table-light">
              <tr>
                <th>Student</th><th>Session</th><th>Reason</th>
                <th>Proof</th><th>Status</th><th>Action</th>
              </tr>
            </thead>
            <tbody>
              ${group.requests.map(r => `
                <tr>
                  <td>${r.student_name}</td>
                  <td>${r.session_date}<br>
                    <span class="text-muted" style="font-size:.78rem">${r.topic||''}</span>
                  </td>
                  <td style="max-width:180px;word-break:break-word">${r.reason}</td>
                  <td>${r.proof_url
                    ? `<a href="${r.proof_url}" target="_blank">View</a>`
                    : '—'}</td>
                  <td>${badge(r.status)}</td>
                  <td>${r.status === 'pending' ? `
                    <button class="btn btn-sm btn-success me-1"
                      onclick="resolveCorr(${r.req_id},'accept')">Accept</button>
                    <button class="btn btn-sm btn-danger"
                      onclick="resolveCorr(${r.req_id},'reject')">Reject</button>` : '—'}
                  </td>
                </tr>`).join("")}
            </tbody>
          </table>
        </div>
      </div>`;
  }).join("");

  // Auto-expand courses with pending requests
  Object.keys(grouped).forEach(courseId => {
    const hasPending = grouped[courseId].requests.some(r => r.status === 'pending');
    if (hasPending) {
      document.getElementById(`ta-corr-${courseId}`)?.classList.remove("d-none");
      const toggle = document.getElementById(`ta-corr-toggle-${courseId}`);
      if (toggle) toggle.textContent = "▼ Hide";
    }
  });
}

function toggleTaCorrCourse(panelId, hdr) {
  const panel    = document.getElementById(panelId);
  const courseId = panelId.replace("ta-corr-", "");
  const toggle   = document.getElementById(`ta-corr-toggle-${courseId}`);
  const hidden   = panel.classList.toggle("d-none");
  toggle.textContent = hidden ? "▶ Show" : "▼ Hide";
}

async function resolveCorr(reqId, action) {
  const d = await api("POST", `/api/ta/corrections/${reqId}/${action}`);
  if (d) { showToast(d.message || d.error, d.error ? "danger" : "success"); loadCorrections(); }
}

loadTaCourses();

window._realtimeHandlers = {
  correction_submitted() { loadCorrections(); showToast("New correction request submitted.", "info"); },
  correction_resolved()  { loadCorrections(); },
  attendance_updated()   { for (const c of _taCourses) loadCourseSessions(c.course_id); },
};
</script>
{% endblock %}
