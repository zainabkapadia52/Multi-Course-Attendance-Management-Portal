{% extends "base.html" %}
{% block content %}
<h4 class="fw-bold mb-4">Instructor Panel</h4>

<ul class="nav nav-tabs mb-4">
  <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-courses">My Courses</button></li>
  <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-sessions">Attendance Sessions</button></li>
  <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-corrections" onclick="loadCorrections()">Correction Requests</button></li>
</ul>

<div class="tab-content">

  <!-- COURSES -->
  <!-- COURSES -->
  <div class="tab-pane fade show active" id="tab-courses">
    <div id="course-cards-container"></div>
  </div>

  <!-- SESSIONS with expandable student list -->
  <!-- SESSIONS with expandable student list -->

    <div class="card">
      <div class="card-header d-flex justify-content-between align-items-center">
        <span>All Attendance Sessions <span class="text-muted" style="font-size:.85rem">(click a row to see students)</span></span>
        <button class="btn btn-sm btn-dark" data-bs-toggle="modal" data-bs-target="#sessionModal">
          + Create Attendance Session
        </button>
      </div>

        <table class="table mb-0" id="sess-table">

          <tbody></tbody>
        </table>
      </div>
    </div>
  </div> -->
  <!-- SESSIONS — course wise -->
  <div class="tab-pane fade" id="tab-sessions">
    <div class="card">
      <div class="card-header d-flex justify-content-between align-items-center">
        <span>Attendance Sessions</span>
        <button class="btn btn-sm btn-dark" data-bs-toggle="modal" data-bs-target="#sessionModal">
          + Create Attendance Session
        </button>
      </div>
      <div class="card-body p-0">
        <div id="sessions-by-course"></div>
      </div>
    </div>
  </div>

  <!-- CORRECTIONS -->
  <!-- CORRECTIONS — course wise -->
  <div class="tab-pane fade" id="tab-corrections">
    <div id="corrections-by-course"></div>
  </div>

</div>

<!-- Create Session Modal -->
<div class="modal fade" id="sessionModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">New Attendance Session</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <div id="sess-err" class="alert alert-danger d-none"></div>
        <div class="row g-3 mb-3">
          <div class="col-md-5">
            <label class="form-label fw-semibold">Course</label>
            <select id="sess-course" class="form-select" onchange="loadStudentsForSession()"><option value="">Select…</option></select>
          </div>
          <div class="col-md-4">
            <label class="form-label fw-semibold">Date</label>
            <input id="sess-date" class="form-control" type="date">
          </div>
          <div class="col-md-3">
            <label class="form-label fw-semibold">Topic</label>
            <input id="sess-topic" class="form-control" placeholder="Optional">
          </div>
        </div>
        <div id="student-list"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-dark" onclick="createSession()">Save Session</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let myCourses = [];

// ── helpers ───────────────────────────────────────────────────────────────────
function studentInfo(s) {
  const parts = [s.roll_no, s.program, s.batch ? `(${s.batch})` : ''].filter(Boolean);
  return parts.length ? `<div class="text-muted" style="font-size:.75rem">${parts.join(' · ')}</div>` : '';
}

function taInfo(t) {
  const parts = [t.department, t.designation].filter(Boolean);
  return parts.length ? `<div class="text-muted" style="font-size:.75rem">${parts.join(' · ')}</div>` : '';
}

// ── courses tab ───────────────────────────────────────────────────────────────
async function loadCourses() {
  myCourses = await api("GET", "/api/instructor/courses");
  if (!myCourses) return;

  // Session modal dropdown
  document.getElementById("sess-course").innerHTML =
    '<option value="">Select…</option>' + myCourses.map(c =>
      `<option value="${c.course_id}">${c.code} — ${c.name}</option>`).join("");

  const container = document.getElementById("course-cards-container");
  if (!myCourses.length) {
    container.innerHTML = '<p class="text-muted p-2">No courses assigned.</p>'; return;
  }

  container.innerHTML = myCourses.map(c => `
    <div class="card mb-3">
      <div class="card-header py-2 d-flex justify-content-between align-items-center">
        <div>
          <span class="badge bg-secondary me-2">${c.code}</span>
          <strong>${c.name}</strong>
          <span class="text-muted ms-2" style="font-size:.85rem">${c.semester}</span>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-sm btn-outline-secondary"
            onclick="togglePanel('students-${c.course_id}', this, () => loadStudentPanel(${c.course_id}))">
            ▶ Students
          </button>
          <button class="btn btn-sm btn-outline-primary"
            onclick="togglePanel('tas-${c.course_id}', this, () => loadTAPanel(${c.course_id}))">
            ▶ TAs
          </button>
        </div>
      </div>
      <div id="students-${c.course_id}" class="d-none border-top">
        <div id="students-inner-${c.course_id}" class="p-3">Loading…</div>
      </div>
      <div id="tas-${c.course_id}" class="d-none border-top">
        <div id="tas-inner-${c.course_id}" class="p-3">Loading…</div>
      </div>
    </div>`).join("");

  // Also build sessions view
  loadSessionsByCourse();
}

async function togglePanel(panelId, btn, loader) {
  const panel  = document.getElementById(panelId);
  const hidden = panel.classList.toggle("d-none");
  const label  = btn.textContent.replace('▶','').replace('▼','').trim();
  btn.textContent = hidden ? `▶ ${label}` : `▼ ${label}`;
  if (!hidden) loader();
}

async function loadStudentPanel(courseId) {
  const inner    = document.getElementById(`students-inner-${courseId}`);
  if (inner.dataset.loaded) return;
  const students = await api("GET", `/api/instructor/courses/${courseId}/students`);
  if (!students) return;
  inner.dataset.loaded = "1";
  if (!students.length) {
    inner.innerHTML = '<p class="text-muted mb-0" style="font-size:.85rem">No students enrolled.</p>'; return;
  }
  inner.innerHTML = `
    <input class="form-control form-control-sm mb-2" placeholder="Search…"
      oninput="filterRows('stu-table-${courseId}', this.value)" style="max-width:200px">
    <div style="max-height:240px;overflow-y:auto">
      <table class="table table-sm mb-0" id="stu-table-${courseId}">
        <thead class="table-light" style="position:sticky;top:0">
          <tr><th>#</th><th>Username</th><th>Roll No</th><th>Program</th><th>Batch</th></tr>
        </thead>
        <tbody>
          ${students.map((s,i) => `
            <tr>
              <td class="text-muted">${i+1}</td>
              <td>${s.username}</td>
              <td>${s.roll_no  || '—'}</td>
              <td>${s.program  || '—'}</td>
              <td>${s.batch    || '—'}</td>
            </tr>`).join("")}
        </tbody>
      </table>
    </div>`;
}

async function loadTAPanel(courseId) {
  const inner = document.getElementById(`tas-inner-${courseId}`);
  if (inner.dataset.loaded) return;
  const [tas, available] = await Promise.all([
    api("GET", `/api/instructor/courses/${courseId}/tas`),
    api("GET", `/api/instructor/available-tas/${courseId}`)
  ]);
  if (!tas) return;
  inner.dataset.loaded = "1";
  renderTAPanel(courseId, tas, available);
}

function renderTAPanel(courseId, tas, available) {
  const inner = document.getElementById(`tas-inner-${courseId}`);
  inner.dataset.loaded = "1";
  const taList = tas.length
    ? `<div class="mb-2">${tas.map(t => `
        <div class="d-flex justify-content-between align-items-center py-1 border-bottom">
          <div>
            <div style="font-size:.84rem;font-weight:500">${t.username}</div>
            ${taInfo(t)}
          </div>
          <button class="btn btn-link btn-sm text-danger p-0"
            onclick="removeTA(${courseId},${t.user_id})">Remove</button>
        </div>`).join("")}</div>`
    : '<p class="text-muted mb-2" style="font-size:.83rem">No TAs assigned.</p>';

  const addRow = available && available.length
    ? `<div class="d-flex gap-2 mt-1">
        <select id="ta-sel-${courseId}" class="form-select form-select-sm">
          ${available.map(t => `<option value="${t.user_id}">${t.username}</option>`).join("")}
        </select>
        <button class="btn btn-sm btn-outline-dark" onclick="addTA(${courseId})">Add</button>
      </div>`
    : '<p class="text-muted mt-1 mb-0" style="font-size:.82rem">No available TAs.</p>';

  inner.innerHTML = taList + addRow;
}

async function addTA(courseId) {
  const sel = document.getElementById(`ta-sel-${courseId}`);
  if (!sel) return;
  const d = await api("POST", `/api/instructor/courses/${courseId}/tas`, { ta_id: parseInt(sel.value) });
  if (!d) return;
  showToast(d.message || d.error, d.error ? "danger" : "success");
  // Reload TA panel fresh
  const inner = document.getElementById(`tas-inner-${courseId}`);
  delete inner.dataset.loaded;
  loadTAPanel(courseId);
}

async function removeTA(courseId, taId) {
  if (!confirm("Remove this TA from the course?")) return;
  const d = await api("DELETE", `/api/instructor/courses/${courseId}/tas/${taId}`);
  if (!d) return;
  showToast(d.message || d.error, d.error ? "danger" : "success");
  const inner = document.getElementById(`tas-inner-${courseId}`);
  delete inner.dataset.loaded;
  loadTAPanel(courseId);
}

function filterRows(tableId, query) {
  document.querySelectorAll(`#${tableId} tbody tr`).forEach(row => {
    row.style.display = row.textContent.toLowerCase().includes(query.toLowerCase()) ? "" : "none";
  });
}

// ── sessions tab — course wise ────────────────────────────────────────────────
async function loadSessionsByCourse() {
  const con = document.getElementById("sessions-by-course");
  if (!myCourses.length) {
    con.innerHTML = '<p class="text-muted p-3">No courses assigned.</p>'; return;
  }

  con.innerHTML = myCourses.map(c => `
    <div class="border-bottom">
      <div class="d-flex justify-content-between align-items-center px-3 py-2"
           style="cursor:pointer;background:#f8f9fa"
           onclick="toggleCourseSessionList(${c.course_id}, this)">
        <span>
          <span class="badge bg-secondary me-2">${c.code}</span>
          <strong>${c.name}</strong>
        </span>
        <span id="sess-toggle-${c.course_id}" style="font-size:.85rem">▶ Show Sessions</span>
      </div>
      <div id="sess-list-${c.course_id}" class="d-none px-3 pb-3 pt-2">
        <p class="text-muted mb-0" style="font-size:.85rem">Loading…</p>
      </div>
    </div>`).join("");
}

async function toggleCourseSessionList(courseId, hdr) {
  const panel  = document.getElementById(`sess-list-${courseId}`);
  const toggle = document.getElementById(`sess-toggle-${courseId}`);
  const hidden = panel.classList.toggle("d-none");
  toggle.textContent = hidden ? "▶ Show Sessions" : "▼ Hide Sessions";

  if (!hidden && panel.dataset.loaded !== "1") {
    panel.dataset.loaded = "1";
    const sessions = await api("GET", `/api/instructor/courses/${courseId}/sessions`);
    if (!sessions || !sessions.length) {
      panel.innerHTML = '<p class="text-muted mb-0" style="font-size:.85rem">No sessions yet.</p>'; return;
    }
    panel.innerHTML = `
      <table class="table table-sm mb-0">
        <thead class="table-light">
          <tr><th>Date</th><th>Topic</th><th>Students</th></tr>
        </thead>
        <tbody>
          ${sessions.map(s => `
            <tr>
              <td>${s.session_date}</td>
              <td>${s.topic || '—'}</td>
              <td>
                <button class="btn btn-link btn-sm p-0"
                  onclick="toggleSessionRecords(${s.att_session_id}, this)">
                  ▶ View
                </button>
              </td>
            </tr>
            <tr id="rec-row-${s.att_session_id}" class="d-none bg-light">
              <td colspan="3" id="rec-cell-${s.att_session_id}" class="p-3">Loading…</td>
            </tr>`).join("")}
        </tbody>
      </table>`;
  }
}

async function toggleSessionRecords(sid, btn) {
  const row  = document.getElementById(`rec-row-${sid}`);
  const cell = document.getElementById(`rec-cell-${sid}`);
  const show = row.classList.toggle("d-none") === false;
  btn.textContent = show ? "▼ Hide" : "▶ View";

  if (show && cell.textContent === "Loading…") {
    const records = await api("GET", `/api/instructor/attendance-sessions/${sid}/records`);
    if (!records || !records.length) {
      cell.innerHTML = '<p class="text-muted mb-0">No records.</p>'; return;
    }
    cell.innerHTML = `
      <table class="table table-sm mb-0" style="max-width:520px">
        <thead class="table-light">
          <tr><th>Student</th><th>Roll No</th><th>Program</th><th>Batch</th><th>Status</th></tr>
        </thead>
        <tbody>
          ${records.map(r => `
            <tr>
              <td>${r.username}</td>
              <td>${r.roll_no  || '—'}</td>
              <td>${r.program  || '—'}</td>
              <td>${r.batch    || '—'}</td>
              <td>${badge(r.status)}</td>
            </tr>`).join("")}
        </tbody>
      </table>`;
  }
}

// ── create session modal ──────────────────────────────────────────────────────
async function loadStudentsForSession() {
  const cid = document.getElementById("sess-course").value;
  const div = document.getElementById("student-list");
  if (!cid) { div.innerHTML = ""; return; }
  const students = await api("GET", `/api/instructor/courses/${cid}/students`);
  if (!students) return;
  div.innerHTML = `
    <label class="form-label fw-semibold">Mark Attendance</label>
    <div style="max-height:280px;overflow-y:auto">
      <table class="table table-sm">
        <thead class="table-light">
          <tr><th>Student</th><th>Roll No</th><th>Program</th><th>Status</th></tr>
        </thead>
        <tbody>
          ${students.map(s => `
            <tr>
              <td>${s.username}</td>
              <td>${s.roll_no  || '—'}</td>
              <td>${s.program  || '—'}</td>
              <td>
                <select class="form-select form-select-sm student-status" data-id="${s.user_id}">
                  <option value="present">Present</option>
                  <option value="absent" selected>Absent</option>
                </select>
              </td>
            </tr>`).join("")}
        </tbody>
      </table>
    </div>`;
}

async function createSession() {
  const errEl      = document.getElementById("sess-err");
  errEl.classList.add("d-none");
  const course_id    = parseInt(document.getElementById("sess-course").value);
  const session_date = document.getElementById("sess-date").value;
  if (!course_id || !session_date) {
    errEl.textContent = "Course and date are required."; errEl.classList.remove("d-none"); return;
  }
  const records = [...document.querySelectorAll(".student-status")].map(el => ({
    student_id: parseInt(el.dataset.id), status: el.value
  }));
  const res = await fetch("/api/instructor/attendance-sessions", {
    method: "POST", headers: _sessionHeaders(),
    body: JSON.stringify({
      course_id, session_date,
      topic: document.getElementById("sess-topic").value,
      records
    })
  });
  if (res.ok) {
    bootstrap.Modal.getInstance(document.getElementById("sessionModal")).hide();
    showToast("Session created!", "success");
    // Reload sessions for this course — reset loaded flag so it re-fetches
    const panel = document.getElementById(`sess-list-${course_id}`);
    if (panel) { delete panel.dataset.loaded; panel.innerHTML = '<p class="text-muted mb-0" style="font-size:.85rem">Loading…</p>'; }
    if (panel && !panel.classList.contains("d-none")) {
      toggleCourseSessionList(course_id, null);
      toggleCourseSessionList(course_id, document.getElementById(`sess-toggle-${course_id}`)?.parentElement);
    }
    loadSessionsByCourse();
  } else {
    const d = await res.json();
    errEl.textContent = d.error; errEl.classList.remove("d-none");
  }
}

// ── corrections ───────────────────────────────────────────────────────────────
async function loadCorrections() {
  const data = await api("GET", "/api/instructor/corrections");
  if (!data) return;

  const con = document.getElementById("corrections-by-course");

  if (!data.length) {
    con.innerHTML = `
      <div class="card">
        <div class="card-body text-muted text-center py-4">No correction requests yet.</div>
      </div>`;
    return;
  }

  // Group by course_id
  const grouped = {};
  for (const r of data) {
    if (!grouped[r.course_id]) {
      grouped[r.course_id] = { course_name: r.course_name, requests: [] };
    }
    grouped[r.course_id].requests.push(r);
  }

  con.innerHTML = Object.entries(grouped).map(([courseId, group]) => {
    const pendingCount = group.requests.filter(r => r.status === 'pending').length;
    return `
      <div class="card mb-3">
        <div class="card-header d-flex justify-content-between align-items-center py-2"
             style="cursor:pointer"
             onclick="toggleCorrCourse('corr-${courseId}', this)">
          <span>
            <strong>${group.course_name}</strong>
            ${pendingCount > 0
              ? `<span class="badge bg-warning text-dark ms-2">${pendingCount} pending</span>`
              : '<span class="badge bg-secondary ms-2">all resolved</span>'}
          </span>
          <span id="corr-toggle-${courseId}" style="font-size:.85rem">▶ Show</span>
        </div>
        <div id="corr-${courseId}" class="d-none">
          <div class="card-body p-0">
            <table class="table mb-0">
              <thead class="table-light">
                <tr>
                  <th>Student</th><th>Session</th><th>Reason</th>
                  <th>Proof</th><th>Status</th><th>Action</th>
                </tr>
              </thead>
              <tbody>
                ${group.requests.map(r => `
                  <tr id="corr-row-${r.req_id}">
                    <td>${r.student_name}</td>
                    <td>${r.session_date}<br>
                      <span class="text-muted" style="font-size:.78rem">${r.topic||''}</span>
                    </td>
                    <td style="max-width:200px;word-break:break-word">${r.reason}</td>
                    <td>${r.proof_url
                      ? `<a href="${r.proof_url}" target="_blank">View</a>`
                      : '—'}</td>
                    <td>${badge(r.status)}</td>
                    <td>${r.status === 'pending' ? `
                      <button class="btn btn-sm btn-success me-1"
                        onclick="resolve(${r.req_id},'accept')">Accept</button>
                      <button class="btn btn-sm btn-danger"
                        onclick="resolve(${r.req_id},'reject')">Reject</button>` : '—'}
                    </td>
                  </tr>`).join("")}
              </tbody>
            </table>
          </div>
        </div>
      </div>`;
  }).join("");

  // Auto-expand courses that have pending requests
  Object.keys(grouped).forEach(courseId => {
    const hasPending = grouped[courseId].requests.some(r => r.status === 'pending');
    if (hasPending) {
      document.getElementById(`corr-${courseId}`)?.classList.remove("d-none");
      const toggle = document.getElementById(`corr-toggle-${courseId}`);
      if (toggle) toggle.textContent = "▼ Hide";
    }
  });
}

function toggleCorrCourse(panelId, hdr) {
  const panel  = document.getElementById(panelId);
  const courseId = panelId.replace("corr-", "");
  const toggle = document.getElementById(`corr-toggle-${courseId}`);
  const hidden = panel.classList.toggle("d-none");
  toggle.textContent = hidden ? "▶ Show" : "▼ Hide";
}

async function resolve(reqId, action) {
  const d = await api("POST", `/api/instructor/corrections/${reqId}/${action}`);
  if (d) { showToast(d.message || d.error, d.error ? "danger" : "success"); loadCorrections(); }
}

// ── init ──────────────────────────────────────────────────────────────────────
loadCourses();

window._realtimeHandlers = {
  correction_submitted() {
    loadCorrections();
    showToast("A student submitted a new correction request.", "info");
  },
};
</script>
{% endblock %}
