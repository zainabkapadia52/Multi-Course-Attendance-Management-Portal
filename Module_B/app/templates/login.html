<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login — CS432</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #1a1a2e; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { border: none; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,.2); }
  </style>
</head>
<body>
<div class="card p-5" style="width:380px">
  <h4 class="fw-bold mb-1">CS432 Attendance</h4>
  <p class="text-muted mb-4" style="font-size:.9rem">IITGN · Sign in to continue</p>
  <div id="err" class="alert alert-danger d-none"></div>
  <div class="mb-3">
    <label class="form-label fw-semibold">Username</label>
    <input id="u" class="form-control" placeholder="e.g. student_a" autofocus>
  </div>
  <div class="mb-4">
    <label class="form-label fw-semibold">Password</label>
    <input id="p" class="form-control" type="password" placeholder="••••••••">
  </div>
  <button class="btn btn-dark w-100 fw-semibold" onclick="doLogin()">Sign in</button>
  <p class="text-muted mt-3 mb-0" style="font-size:.8rem">
    Test logins: admin / prof_singh / student_a · password: password123
  </p>
</div>
<script>
async function doLogin() {
  const res = await fetch("/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ user: document.getElementById("u").value, password: document.getElementById("p").value })
  });
  const data = await res.json();
  if (res.ok) {
    window.location.href = "/";
  } else {
    const err = document.getElementById("err");
    err.textContent = data.error;
    err.classList.remove("d-none");
  }
}
document.addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
</script>
</body>
</html>
