<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CS432 Attendance System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f4f6fb; }
    .navbar { background: #1a1a2e !important; }
    .navbar-brand, .nav-link, .navbar-text { color: #e0e0e0 !important; }
    .nav-link:hover { color: #ffffff !important; }
    .card { border: none; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.07); }
    .card-header { background: transparent; border-bottom: 1px solid #eee; font-weight: 600; }
    .nav-tabs .nav-link.active { font-weight: 600; }
    .badge-pending  { background: #fff3cd; color: #856404; }
    .badge-accepted { background: #d1e7dd; color: #0a3622; }
    .badge-rejected { background: #f8d7da; color: #842029; }
    .badge-present  { background: #d1e7dd; color: #0a3622; }
    .badge-absent   { background: #f8d7da; color: #842029; }
    .badge-late     { background: #fff3cd; color: #856404; }
  </style>
</head>
<body>
  <script>
  // If this page was served from cache after logout,
  // re-validate with the server immediately on load
  window.addEventListener("pageshow", function(e) {
    // e.persisted = true means page came from bfcache (back-forward cache)
    if (e.persisted) {
      fetch("/isAuth", { credentials: "include" })
        .then(r => { if (!r.ok) window.location.replace("/login"); })
        .catch(() => window.location.replace("/login"));
    }
  });
</script>
<nav class="navbar navbar-expand-lg mb-4">
  <div class="container">
    <span class="navbar-brand fw-bold">🎓 CS432 Attendance</span>
    <div class="ms-auto d-flex align-items-center gap-3">
      <span class="navbar-text">
        <span class="badge bg-secondary">{{ user.role }}</span>
        {{ user.username }}
      </span>
      <form action="/logout" method="post">
        <button class="btn btn-sm btn-outline-light">Logout</button>
      </form>
    </div>
  </div>
</nav>
<div class="container pb-5">
  {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
async function api(method, url, body) {
  const opts = { method, headers: { "Content-Type": "application/json" } };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(url, opts);
  return res.json();
}
function badge(status) {
  return `<span class="badge badge-${status}">${status}</span>`;
}
</script>
<script>
// ── Real-time SSE listener ────────────────────────────────────────────────────
const _es = new EventSource("/stream");

// What each page re-fetches when an event arrives
// Each dashboard overrides window._realtimeHandlers with its own functions
window._realtimeHandlers = {};

const _defaultHandlers = {
  correction_resolved:         () => {},
  correction_submitted:        () => {},
  attendance_session_created:  () => {},
  attendance_updated:          () => {},
};

_es.addEventListener("connected", () => {
  console.log("[SSE] connected");
});

_es.onmessage = (e) => {
  try {
    const event   = JSON.parse(e.data);
    const handler = (window._realtimeHandlers[event.type]
                    || _defaultHandlers[event.type]);
    if (handler) handler(event.data);
  } catch (_) {}
};

_es.onerror = () => {
  // Browser auto-reconnects SSE — no action needed
};
</script>
{% block scripts %}{% endblock %}
</body>
</html>
